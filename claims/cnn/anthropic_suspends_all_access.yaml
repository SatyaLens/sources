"summary": "The US government ordered AI company Anthropic to suspend all access by foreign nationals to its Mythos 5 and Fable 5 models, its most capable AI systems, Anthropic said in a statement Friday evening. As a result, Anthropic has disabled access to those models for all of its customers."
"title": "Anthropic suspends all access to Mythos model after US government bans foreign nationals use"
