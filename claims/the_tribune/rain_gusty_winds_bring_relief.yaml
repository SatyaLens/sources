"summary": "After weeks of intense heat, Delhi witnessed a sharp change in weather on Friday as cloudy skies, light rain and gusty winds brought temperature down across the city, providing much-needed relief to residents. The maximum temperature at Safdarjung, the city’s base weather station, settled at 36.8 degrees Celsius — the lowest recorded in Delhi since [...]"
"title": "Rain, gusty winds bring relief from intense heat in Capital"
