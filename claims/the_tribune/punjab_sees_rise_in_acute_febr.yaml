"summary": "Punjab has witnessed a rise in acute febrile illnesses amid soaring temperatures above 40 degrees Celsius, with 5,840 cases treated under the Mukh Mantri Sehat Yojana over the last four months, according to a health department report. Figures shared under the scheme show that Rs 1.31 crore was released for the treatment of these cases. [...]"
"title": "Punjab sees rise in acute febrile illnesses amid soaring temperatures"
