"summary": "A moderate earthquake measuring 5.0 on the Richter scale shook Palampur and adjoining areas on Saturday night at 10.04 pm, triggering panic among residents and reviving memories of the devastating 1905 Kangra earthquake. The tremors were felt across several parts of Kangra district, prompting people to rush out of their homes, offices, and commercial establishments [...]"
"title": "Moderate earthquake jolts Palampur; residents recall 1905 deadly Kangra quake"
