"summary": "The popular northbound cross-border scheme allowing Hong Kong vehicles to travel to Guangdong province has been extended by five years, mainland authorities have announced, as the initial three-year implementation period is set to expire. Under the “Northbound Travel for Hong Kong Vehicles” scheme, eligible private car owners in Hong Kong can drive into Guangdong via the Hong Kong–Zhuhai–Macau Bridge without a mainland number plate or dual-plate permit. Drivers can stay in Guangdong for up to 30..."
"title": "Hong Kong cross-border car scheme to Guangdong extended to 2031"
