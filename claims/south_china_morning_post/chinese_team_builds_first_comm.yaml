"summary": "China activated the world’s first three-band optical fibre communication system early this month, technology that its developers say could expand the carrying capacity of future AI networks. According to the project team, a single fibre can carry more than five times the traffic of conventional systems, while transmission capacity per core increases by nearly half. The project, completed in Qingdao in the eastern Chinese province of Shandong, was jointly developed by state-owned..."
