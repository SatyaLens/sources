"summary": "Nearly 500 Ebola cases have now been confirmed in the deadly outbreak raging in central Africa, a WHO overview showed on Saturday, amid mounting concern over the swelling scale of the epidemic. In its daily update on the situation, the World Health Organization tallied 452 confirmed cases, including 82 deaths, in the Democratic Republic of Congo (DR Congo), where the outbreak was declared three weeks ago. In neighbouring Uganda, meanwhile, it counted 19 confirmed cases, including two deaths. The..."
