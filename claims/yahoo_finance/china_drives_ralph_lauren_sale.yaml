"summary": "Ralph Lauren surpassed $8 billion in annual revenue for the first time in FY26, driven by strong global growth, particularly in Asia where revenue rose 23% (and 31% in Q4). The company saw broad gains across North America and Europe, with high-potential categories like women's apparel and handbags outpacing overall growth. For FY27, Ralph Lauren projects mid-single-digit revenue growth (4-5%) and continued expansion of its operating margins."
"title": "China drives Ralph Lauren sales to surpass $8bn in FY26"
