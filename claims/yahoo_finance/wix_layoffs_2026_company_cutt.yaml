"summary": "Wix is laying off approximately 1,000 employees, about 20% of its workforce, in its deepest restructuring to date. CEO Avishai Abrahami cited two primary drivers: the strengthening Israeli shekel increasing operational costs against dollar-denominated revenue, and the need to reorganize around AI. The company is flattening its management structure and introducing AI-native roles. These cuts follow a significant stock price decline and a first-quarter net loss of $57.5 million."
"title": "Wix layoffs 2026: company cutting 20% of workforce"
