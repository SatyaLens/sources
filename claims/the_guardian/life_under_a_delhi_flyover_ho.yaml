"summary": "Hour by hour, Shahida and her baby are exposed to the full force of the deadly temperatures affecting India’s capital – without reliable access to food, water or healthcare. Here is a day in their lives Delhi is sweltering through another summer of extreme heat, with top daytime readings consistently reaching 43C and even minimum temperatures hovering around 32.4C (90.3F). Last week the city endured its warmest May night in 14 years . As government heat alerts follow one after another and people retreat indoors, more than 300,000 individuals living on the city’s streets remain out in the punishing heat. Shahida dreads the arrival of summer, and this year, she has the additional worry of keeping nine-month-old Jannat safe from the heat Continue reading..."
"title": "Life under a Delhi flyover: how one homeless family endures the city’s extreme heat"
